domain: checkers

# Public listener uses HTTP unless the deployment enables HTTPS.
https:
  enabled: false
# Optional registry/namespace prefix without a trailing slash.
imageRepository: ""
image: checkers:latest

# Cluster-specific ingress, DNS and OIDC selectors; enabled by Skaffold.
networkPolicy:
  enabled: false

# Optional credentials for private images. Public packages need none.
# imagePullSecret: zot-pull-secret

# Application settings; README.md documents the matching environment variables.
authMode: invite
rules: english-default
spectatorMode: invite
enableMatchmaking: true
enableComputer: true
enableDemo: true
enableLocalPlay: false
allowSelfPlay: false
