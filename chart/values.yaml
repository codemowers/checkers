domain: checkers

# Public listener uses HTTP unless the deployment enables HTTPS.
https:
  enabled: false
# Registry/namespace prefix for short image names. Full image paths override it.
imageRegistry: ghcr.io/codemowers
image: checkers:latest

# Cluster-specific ingress, DNS and OIDC selectors; enabled by Skaffold.
networkPolicy:
  enabled: false

# Optional credentials for private images. Public packages need none.
# imagePullSecret: zot-pull-secret

env:
  AUTH_MODE: invite
  ENABLE_COMPUTER: "true"
  ENABLE_DEMO: "true"
  SPECTATOR_MODE: invite
  ALLOW_SELF_PLAY: "false"
