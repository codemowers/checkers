apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  {{- if .Values.https.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s-tls@kubernetescrd" .Release.Namespace .Release.Name | quote }}
  {{- end }}
  labels:
    app: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - name: {{ ternary "https" "http" .Values.https.enabled }}
      port: {{ ternary 443 3000 .Values.https.enabled }}
      targetPort: {{ ternary "https" "http" .Values.https.enabled }}
