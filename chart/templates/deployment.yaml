apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkers-web
  template:
    metadata:
      labels:
        app: checkers-web
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "checkers.image" (dict "registry" .Values.imageRegistry "image" .Values.image) | quote }}
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3001
            - name: metrics
              containerPort: 3002
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: OIDC_IDP_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_IDP_DISPLAY_NAME
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_IDP_URI
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_CLIENT_ORIGIN
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_CLIENT_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: checkers-nextauth
                  key: secret
            - name: REDIS_URL
              value: rediss://checkers-redis.{{ .Release.Namespace }}:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkers-redis-auth
                  key: password
            - name: TLS_CERT_FILE
              value: /var/run/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /var/run/tls/tls.key
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /ready
              port: metrics
            initialDelaySeconds: 3
          volumeMounts:
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tls
          secret:
            secretName: checkers-web-internal-tls
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
