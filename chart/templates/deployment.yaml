apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkers-web
  template:
    metadata:
      labels:
        app: checkers-web
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Public image, so the chart installs with no pull secret and no values.
          # Skaffold replaces this with its own build via `image` in skaffold.yaml.
          image: {{ .Values.image | default "ghcr.io/codemowers/checkers:latest" | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_IDP_URI
            - name: NEXTAUTH_URL
              value: https://{{ .Values.domain }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-client-checkers-owner-secrets
                  key: OIDC_CLIENT_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: checkers-nextauth
                  key: secret
            - name: REDIS_URL
              value: redis://checkers-redis:6379/0
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
