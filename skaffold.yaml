apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: checkers
build:
  platforms:
    - linux/amd64
  cluster:
    dockerConfig:
      secretName: zot-registry-cluster-push-kaniko
  artifacts:
    - image: checkers
      context: .
      kaniko:
        dockerfile: Dockerfile
manifests:
  helm:
    releases:
      - name: checkers
        chartPath: chart
        setValues:
          https.enabled: true
          networkPolicy.enabled: true
          env.AUTH_MODE: optional
          env.ENABLE_LOCAL_PLAY: "true"

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true

profiles:
  # skaffold dev -p local: build with the local Docker daemon and push.
  - name: local
    build:
      platforms:
        - linux/amd64
      local:
        push: true
      artifacts:
        - image: checkers
          context: .
          docker:
            dockerfile: Dockerfile
