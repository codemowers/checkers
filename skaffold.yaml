apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: checkers
build:
  platforms:
    - linux/amd64
  local:
    push: true
  artifacts:
    - image: zot.ee-lte-1.codemowers.io/laurivosandi/checkers
      context: .
deploy:
  kubeContext: admin@ee-lte-1.codemowers.io
  helm:
    releases:
      - name: checkers
        chartPath: chart
        namespace: demo
        setValues:
          imagePullSecret: zot-pull-secret
          env.AUTH_MODE: optional
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_zot_ee_lte_1_codemowers_io_laurivosandi_checkers}}"
