apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: checkers
build:
  platforms:
    - linux/amd64
  local:
    push: true
  artifacts:
    - image: checkers
      context: .
manifests:
  helm:
    releases:
      - name: checkers
        chartPath: chart
        namespace: demo
        setValues:
          https.enabled: true
          networkPolicy.enabled: true
          env.AUTH_MODE: optional
          env.ENABLE_LOCAL_PLAY: "true"
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_checkers}}"

deploy:
  kubectl:
    flags:
      # Keep labeled chart resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true
