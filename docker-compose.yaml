services:
  checkers-redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    command:
      - --bind=0.0.0.0
      - --proactor_threads=1
      - --maxmemory=256mb
      - --snapshot_cron=
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 15

  web:
    build:
      context: .
      target: development
    environment:
      AUTH_MODE: anon
      RULES: ${RULES:-english-default}
      ENABLE_COMPUTER: ${ENABLE_COMPUTER:-true}
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      ENABLE_LOCAL_PLAY: ${ENABLE_LOCAL_PLAY:-true}
      ENABLE_MATCHMAKING: ${ENABLE_MATCHMAKING:-true}
      SPECTATOR_MODE: ${SPECTATOR_MODE:-invite}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "3001:3001"
    volumes:
      - ./app:/app/app:ro
      - ./lib:/app/lib:ro
      - ./runtime:/app/runtime:ro
      - ./proxy.ts:/app/proxy.ts:ro
      - ./next.config.js:/app/next.config.js:ro
    tmpfs:
      - /app/.next:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0755
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/ready').then(r => process.exit(r.ok ? 0 : 1))
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    depends_on:
      checkers-redis:
        condition: service_healthy

  test:
    profiles:
      - test
    build:
      context: .
      target: development
    environment:
      TEST_REDIS_URL: redis://checkers-redis:6379/0
    command:
      - sh
      - -c
      - npm run typecheck && node --test runtime/*.check.mjs && npm test
    depends_on:
      checkers-redis:
        condition: service_healthy
