name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Typecheck and test with Dragonfly
        run: docker compose --profile test run --build --rm test

      - name: Check development health
        run: docker compose up --build --wait web

      - name: Clean up
        if: always()
        run: docker compose down --volumes

  container:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/codemowers
            org.opencontainers.image.vendor=Codemowers OÜ
            org.opencontainers.image.licenses=MIT
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: checkers:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test production HTTP and TLS
        run: bash scripts/smoke-image.sh checkers:ci

      - name: Scan image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL checkers:ci

      - name: Publish verified image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag checkers:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  chart:
    runs-on: ubuntu-latest
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart with release image
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/package"
          image="ghcr.io/${{ github.repository_owner }}/checkers:${version}"
          digest="$(docker buildx imagetools inspect "$image" | awk '/Digest:/ { print $2; exit }')"
          test -n "$digest"
          RELEASE_IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}" RELEASE_IMAGE="checkers@${digest}" \
            yq -i '.imageRepository = strenv(RELEASE_IMAGE_REPOSITORY) | .image = strenv(RELEASE_IMAGE)' chart/values.yaml
          helm package chart --destination "$RUNNER_TEMP/package" --version "$version" --app-version "$GITHUB_REF_NAME"
          helm push "$RUNNER_TEMP/package/checkers-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
